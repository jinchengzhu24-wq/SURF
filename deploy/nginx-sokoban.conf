# Unified Nginx reverse-proxy configuration for the Sokoban AI Study Platform.
#
# Both the 8000 study/matchmaking APIs and the 8010 co-creation workbench now run
# inside a single FastAPI process listening on 127.0.0.1:8000.

# Trusted proxy CIDRs permitted to supply X-Forwarded-Proto.
# Untrusted clients fall back safely to $scheme so forwarded proto cannot be spoofed.
#
# When sitting behind Cloudflare (or another reverse proxy / load balancer):
#   1. If `ngx_http_realip_module` rewrites `$remote_addr` (`set_real_ip_from` +
#      `real_ip_header CF-Connecting-IP`), change `geo $remote_addr` below to
#      `geo $realip_remote_addr` so the proxy peer IP is still matched.
#   2. Keep Cloudflare IP ranges synced with https://www.cloudflare.com/ips/.
geo $remote_addr $sokoban_trusted_proxy {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;

    # Cloudflare IPv4 ranges:
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    # Cloudflare IPv6 ranges:
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "${sokoban_trusted_proxy}:${http_x_forwarded_proto}" $sokoban_public_proto {
    default $scheme;
    ~* "^1:http\b" http;
    ~* "^1:https\b" https;
}

upstream sokoban_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    listen 16384;
    listen [::]:16384;
    server_name sokobanaidemo.top;

    client_max_body_size 10m;

    # Shared upstream proxy defaults inherited by all locations below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sokoban_public_proto;
    proxy_connect_timeout 5s;

    if ($sokoban_public_proto != https) {
        return 308 https://$host$request_uri;
    }

    location = /cocreation {
        return 301 https://$host/cocreation/;
    }

    location = /cocreation/ {
        proxy_pass http://sokoban_backend;
        # Backend LLM requests enforce a 120s budget (116s internal deadline) and
        # the browser times out at 125s; keep 135s proxy headroom for serialization.
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /cocreation/index.html {
        proxy_pass http://sokoban_backend;
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /cocreation/ {
        proxy_pass http://sokoban_backend;
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
    }

    location /api/ {
        proxy_pass http://sokoban_backend;
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
    }

    location = /frontend {
        proxy_pass http://sokoban_backend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /frontend/ {
        proxy_pass http://sokoban_backend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /frontend/index.html {
        proxy_pass http://sokoban_backend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /frontend/ {
        proxy_pass http://sokoban_backend;
    }

    location = /game {
        proxy_pass http://sokoban_backend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /game/ {
        proxy_pass http://sokoban_backend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /game/index.html {
        proxy_pass http://sokoban_backend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /game/TemplateData/sokoban-bridge.js {
        proxy_pass http://sokoban_backend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /game/ {
        proxy_pass http://sokoban_backend;
    }

    location / {
        proxy_pass http://sokoban_backend;
        proxy_read_timeout 75s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.sokobanaidemo.top;

    return 308 https://sokobanaidemo.top$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 308 https://sokobanaidemo.top$request_uri;
}
