[project]
name = "sokoban-platform"
version = "0.1.0"
description = "Unified Sokoban AI study platform: FastAPI server, core solver/generator, and web apps"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "openai==2.36.0",
    "httpx==0.28.1",
    "pydantic==2.12.4",
    "pydantic-settings",
    "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
