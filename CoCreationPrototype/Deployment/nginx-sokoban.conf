server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 111.231.136.4 _;

    location = /cocreation {
        return 301 /cocreation/;
    }

    location /game/ {
        proxy_pass http://127.0.0.1:8000/game/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /frontend/ {
        proxy_pass http://127.0.0.1:8000/frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cocreation/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_connect_timeout 5s;
        # Proposal generation may use the dedicated 300-second backend
        # budget; keep a little proxy headroom for response serialization.
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
