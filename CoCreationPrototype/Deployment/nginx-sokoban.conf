map $http_x_forwarded_proto $sokoban_public_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    listen [::]:80;
    listen 16384;
    listen [::]:16384;
    server_name sokobanaidemo.top;

    client_max_body_size 10m;

    if ($sokoban_public_proto != https) {
        return 308 https://sokobanaidemo.top$request_uri;
    }

    location = /cocreation {
        return 301 /cocreation/;
    }

    location = /cocreation/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sokoban_public_proto;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /cocreation/index.html {
        proxy_pass http://127.0.0.1:8010/index.html;
        proxy_connect_timeout 5s;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sokoban_public_proto;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /game/ {
        proxy_pass http://127.0.0.1:8000/game/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sokoban_public_proto;
    }

    location /frontend/ {
        proxy_pass http://127.0.0.1:8000/frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sokoban_public_proto;
    }

    location /cocreation/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_connect_timeout 5s;
        # Proposal generation may use the dedicated 300-second backend
        # budget; keep a little proxy headroom for response serialization.
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sokoban_public_proto;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sokoban_public_proto;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.sokobanaidemo.top;

    return 308 https://sokobanaidemo.top$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 111.231.136.4 _;

    return 308 https://sokobanaidemo.top$request_uri;
}
