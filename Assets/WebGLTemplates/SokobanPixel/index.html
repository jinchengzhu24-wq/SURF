<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#315a73">
    <title>{{{ PRODUCT_NAME }}} | WebGL Quest</title>
    <link rel="stylesheet" href="TemplateData/style.css?v=sokoban-pixel-2">
    <style>
      .dashboard-access-modal[hidden] { display: none; }
      .dashboard-access-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(21, 30, 25, 0.78);
      }
      .dashboard-access-card {
        width: min(460px, 100%);
        border: 4px solid var(--wood-dark);
        color: var(--ink);
        background: var(--paper);
        box-shadow: var(--pixel-shadow);
      }
      .dashboard-access-header {
        padding: 18px 22px;
        color: #fff5d1;
        background: var(--wood);
        border-bottom: 4px solid var(--wood-dark);
      }
      .dashboard-access-header h2 {
        margin: 0;
        font-size: clamp(18px, 3vw, 26px);
        letter-spacing: 0.04em;
      }
      .dashboard-access-body { padding: 22px; }
      .dashboard-access-body p { margin: 0 0 14px; line-height: 1.45; }
      .dashboard-access-body label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
      }
      .dashboard-access-body input {
        width: 100%;
        min-height: 46px;
        padding: 8px 12px;
        border: 3px solid var(--wood-dark);
        color: var(--ink);
        background: #fffdf4;
      }
      .dashboard-access-status {
        min-height: 1.4em;
        margin-top: 10px !important;
        color: #9b3027;
        font-size: 0.9em;
      }
      .dashboard-access-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding: 14px 22px 18px;
        border-top: 4px solid var(--stone-mid);
      }
      .dashboard-access-actions button {
        min-width: 112px;
        min-height: 44px;
        padding: 8px 14px;
        border: 3px solid var(--wood-dark);
        cursor: pointer;
        font-weight: 700;
      }
      #dashboard-access-cancel { color: var(--ink); background: var(--stone-light); }
      #dashboard-access-submit { color: #fff5d1; background: #b84c3e; }
      .dashboard-access-actions button:disabled { cursor: wait; opacity: 0.6; }

      #sokoban-lobby-native-overlay[hidden] { display: none; }
      #sokoban-lobby-native-overlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }
      #sokoban-lobby-native-overlay input {
        position: absolute;
        display: block;
        box-sizing: border-box;
        margin: 0;
        border: 0;
        border-radius: 0;
        outline: none;
        color: #424a53;
        background: #e5ebee;
        box-shadow: none;
        font-family: Consolas, "Courier New", monospace;
        font-size: 40px;
        font-weight: 700;
        line-height: 1;
        pointer-events: auto;
        user-select: text;
        -webkit-user-select: text;
      }
      #sokoban-lobby-native-overlay input:focus {
        outline: 3px solid var(--gold-light);
        outline-offset: -5px;
      }
      #sokoban-lobby-generated-room-code {
        text-align: center;
      }
      #sokoban-lobby-generated-room-code:disabled {
        cursor: default;
        opacity: 1;
      }
      #sokoban-lobby-generated-room-code::placeholder {
        color: #424a53;
        opacity: 1;
      }
      #sokoban-lobby-join-room-code {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <main class="adventure-shell">
      <header class="wood-sign" aria-label="Game title">
        <div class="sign-bolt" aria-hidden="true"></div>
        <div>
          <p class="sign-kicker">SOKOBAN · WEBGL QUEST</p>
          <h1>{{{ PRODUCT_NAME }}}</h1>
          <p class="sign-subtitle">AI 推箱子研究冒险</p>
        </div>
        <div class="sign-bolt" aria-hidden="true"></div>
      </header>

      <section class="stone-frame">
        <div class="frame-heading">
          <span class="frame-step">▶</span>
          <span>GAME SESSION</span>
          <span class="frame-status">WEBGL</span>
        </div>

        <div class="game-viewport">
          <div id="unity-container" class="unity-desktop">
            <canvas
              id="unity-canvas"
              width={{{ WIDTH }}}
              height={{{ HEIGHT }}}
              tabindex="-1"
              aria-label="{{{ PRODUCT_NAME }}} game canvas"
            ></canvas>

            <div id="sokoban-lobby-native-overlay" hidden aria-label="Online lobby browser inputs">
              <input
                id="sokoban-lobby-generated-room-code"
                type="text"
                readonly
                disabled
                autocomplete="off"
                placeholder="ROOM CODE APPEARS HERE"
                aria-label="Generated room code"
              >
              <input
                id="sokoban-lobby-join-room-code"
                type="text"
                inputmode="text"
                maxlength="6"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                aria-label="Room code to join"
              >
            </div>

            <div id="unity-loading-bar">
              <div class="loading-card">
                <div class="pixel-crate" aria-hidden="true"></div>
                <p class="loading-kicker">PREPARING ADVENTURE</p>
                <div id="unity-progress-bar-empty" role="progressbar" aria-label="Loading game">
                  <div id="unity-progress-bar-full"></div>
                </div>
                <p id="unity-loading-percent">Loading 0%</p>
              </div>
            </div>

            <div id="unity-warning" aria-live="polite"></div>
          </div>
        </div>

        <footer id="unity-footer">
          <div class="control-hint">
            <span class="keycap">WASD</span>
            <span>MOVE · PUSH · SOLVE</span>
          </div>
          <div class="footer-actions">
            <a
              class="pixel-button secondary"
              href="http://111.231.136.4/frontend/"
              data-dashboard-link
              target="_blank"
              rel="noopener noreferrer"
            >DATA DASHBOARD</a>
            <button id="unity-fullscreen-button" class="pixel-button" type="button">
              FULLSCREEN
            </button>
          </div>
        </footer>
      </section>
    </main>

    <div id="dashboard-access-modal" class="dashboard-access-modal" hidden>
      <form id="dashboard-access-form" class="dashboard-access-card">
        <div class="dashboard-access-header">
          <h2>DASHBOARD ACCESS</h2>
        </div>
        <div class="dashboard-access-body">
          <p>Enter the study dashboard password to continue.</p>
          <label for="dashboard-access-password">Password</label>
          <input id="dashboard-access-password" type="password" autocomplete="off" required>
          <p id="dashboard-access-status" class="dashboard-access-status" role="alert" aria-live="assertive"></p>
        </div>
        <div class="dashboard-access-actions">
          <button id="dashboard-access-cancel" type="button">CANCEL</button>
          <button id="dashboard-access-submit" type="submit">CONTINUE</button>
        </div>
      </form>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingPercent = document.querySelector("#unity-loading-percent");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var dashboardAccessModal = document.querySelector("#dashboard-access-modal");
      var dashboardAccessForm = document.querySelector("#dashboard-access-form");
      var dashboardAccessPassword = document.querySelector("#dashboard-access-password");
      var dashboardAccessStatus = document.querySelector("#dashboard-access-status");
      var dashboardAccessCancel = document.querySelector("#dashboard-access-cancel");
      var dashboardAccessSubmit = document.querySelector("#dashboard-access-submit");
      var dashboardAccessTarget = "http://111.231.136.4/frontend/";
      var lobbyNativeOverlay = document.querySelector("#sokoban-lobby-native-overlay");
      var lobbyGeneratedRoomCode = document.querySelector("#sokoban-lobby-generated-room-code");
      var lobbyJoinRoomCode = document.querySelector("#sokoban-lobby-join-room-code");
      var lobbyReferenceWidth = 1920;
      var lobbyReferenceHeight = 1080;
      var lobbyOverlayVisible = false;
      window.SokobanUnityInstance = null;

      function normalizeLobbyRoomCode(value) {
        return (value || "")
          .toUpperCase()
          .replace(/[^A-Z0-9]/g, "")
          .slice(0, 6);
      }

      function sendLobbyMessage(methodName, value) {
        if (!window.SokobanUnityInstance) return;

        try {
          if (typeof value === "undefined") {
            window.SokobanUnityInstance.SendMessage("OnlineLobbyController", methodName);
          } else {
            window.SokobanUnityInstance.SendMessage(
              "OnlineLobbyController",
              methodName,
              value
            );
          }
        } catch (error) {
          // The Unity scene may be unloading while the browser input is active.
        }
      }

      function positionLobbyNativeInputs() {
        if (!lobbyNativeOverlay || !canvas || !lobbyOverlayVisible) return;

        var overlayRect = lobbyNativeOverlay.getBoundingClientRect();
        var canvasRect = canvas.getBoundingClientRect();
        var scaleX = canvasRect.width / lobbyReferenceWidth;
        var scaleY = canvasRect.height / lobbyReferenceHeight;
        var offsetX = canvasRect.left - overlayRect.left;
        var offsetY = canvasRect.top - overlayRect.top;

        function placeInput(input, left, top, width, height, padding) {
          input.style.left = (offsetX + left * scaleX) + "px";
          input.style.top = (offsetY + top * scaleY) + "px";
          input.style.width = (width * scaleX) + "px";
          input.style.height = (height * scaleY) + "px";
          input.style.fontSize = (40 * scaleY) + "px";
          input.style.padding = "0 " + (padding * scaleX) + "px";
        }

        // These are the fixed reference-space rectangles from Online_Lobby.unity.
        placeInput(lobbyGeneratedRoomCode, 285, 574, 570, 82, 18);
        placeInput(lobbyJoinRoomCode, 1065, 574, 570, 82, 24);
      }

      window.SokobanSetLobbyOverlayVisible = function (visible) {
        lobbyOverlayVisible = !!visible;
        if (lobbyNativeOverlay) {
          lobbyNativeOverlay.hidden = !lobbyOverlayVisible;
        }
        if (!lobbyOverlayVisible) {
          if (document.activeElement === lobbyGeneratedRoomCode
            || document.activeElement === lobbyJoinRoomCode) {
            document.activeElement.blur();
          }
          return;
        }

        positionLobbyNativeInputs();
      };

      window.SokobanSetLobbyRoomCode = function (value) {
        if (!lobbyGeneratedRoomCode) return;

        var roomCode = value === "ROOM CODE APPEARS HERE" ? "" : (value || "");
        lobbyGeneratedRoomCode.value = roomCode;
        lobbyGeneratedRoomCode.disabled = !roomCode;
        lobbyGeneratedRoomCode.setAttribute(
          "aria-label",
          roomCode ? "Generated room code" : "Room code will appear here"
        );
      };

      window.SokobanSetLobbyJoinCode = function (value) {
        if (!lobbyJoinRoomCode) return;
        lobbyJoinRoomCode.value = normalizeLobbyRoomCode(value);
      };

      lobbyJoinRoomCode.addEventListener("input", function () {
        var normalized = normalizeLobbyRoomCode(lobbyJoinRoomCode.value);
        if (lobbyJoinRoomCode.value !== normalized) {
          lobbyJoinRoomCode.value = normalized;
        }
        sendLobbyMessage("SetNativeJoinRoomCode", normalized);
      });

      lobbyJoinRoomCode.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") return;
        event.preventDefault();
        event.stopPropagation();
        sendLobbyMessage("SubmitNativeJoinRoomCode");
      });

      window.addEventListener("resize", positionLobbyNativeInputs);
      document.addEventListener("fullscreenchange", positionLobbyNativeInputs);

      function captureDashboardPasswordKey(event) {
        if (dashboardAccessModal.hidden
          || !event.target
          || !dashboardAccessModal.contains(event.target)) {
          return;
        }

        if (event.type === "keydown") {
          if (event.key === "Backspace") {
            dashboardAccessPassword.value = dashboardAccessPassword.value.slice(0, -1);
          } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey) {
            dashboardAccessPassword.value += event.key;
          } else if (event.key === "Enter") {
            dashboardAccessForm.requestSubmit();
          }

          dashboardAccessPassword.dispatchEvent(new Event("input", { bubbles: true }));
        }

        event.preventDefault();
        event.stopImmediatePropagation();
        dashboardAccessPassword.focus();
      }

      ["keydown", "keypress", "keyup"].forEach(function (eventName) {
        window.addEventListener(eventName, captureDashboardPasswordKey, true);
      });

      window.SokobanOpenDashboardGate = function (url) {
        dashboardAccessTarget = url || dashboardAccessTarget;
        dashboardAccessStatus.textContent = "";
        dashboardAccessPassword.value = "";
        dashboardAccessModal.hidden = false;
        window.setTimeout(function () { dashboardAccessPassword.focus(); }, 0);
      };

      function closeDashboardAccessGate() {
        if (dashboardAccessSubmit.disabled) return;
        dashboardAccessModal.hidden = true;
        dashboardAccessPassword.value = "";
        dashboardAccessStatus.textContent = "";
      }

      dashboardAccessCancel.addEventListener("click", closeDashboardAccessGate);
      dashboardAccessForm.addEventListener("submit", function (event) {
        event.preventDefault();

        var password = dashboardAccessPassword.value;
        if (!password) return;

        dashboardAccessSubmit.disabled = true;
        dashboardAccessCancel.disabled = true;
        dashboardAccessStatus.textContent = "Checking password...";

        var popup = window.open("about:blank", "_blank");
        fetch("http://111.231.136.4:8000/verify-dashboard-password", {
          method: "POST",
          headers: { "X-Delete-Password": password }
        }).then(function (response) {
          if (!response.ok) throw new Error("Incorrect password");
          if (popup && !popup.closed) {
            popup.location.href = dashboardAccessTarget;
          } else {
            throw new Error("Please allow popups to open the dashboard.");
          }
          dashboardAccessModal.hidden = true;
        }).catch(function (error) {
          if (popup && !popup.closed) popup.close();
          dashboardAccessStatus.textContent = error.message || "Could not verify password.";
          dashboardAccessSubmit.disabled = false;
          dashboardAccessCancel.disabled = false;
          dashboardAccessPassword.focus();
        });
      });

      document.querySelectorAll("[data-dashboard-link]").forEach(function (link) {
        link.addEventListener("click", function (event) {
          event.preventDefault();
          window.SokobanOpenDashboardGate(link.href);
        });
      });

      function unityShowBanner(message, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "grid" : "none";
        }

        var banner = document.createElement("div");
        banner.className = "unity-banner " + (type || "info");
        banner.innerHTML = message;
        warningBanner.appendChild(banner);

        if (type !== "error") {
          setTimeout(function () {
            if (banner.parentNode) {
              warningBanner.removeChild(banner);
            }
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildVersion = "?v=native-lobby-input-webgl-20260828-1";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}" + buildVersion;
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}" + buildVersion,
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}" + buildVersion,
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}" + buildVersion,
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}" + buildVersion,
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}" + buildVersion,
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}" + buildVersion,
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.body.classList.add("mobile-game");
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      loadingBar.style.display = "grid";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percentage = Math.round(progress * 100);
          progressBarFull.style.width = percentage + "%";
          progressBarEmpty.setAttribute("aria-valuenow", percentage);
          loadingPercent.textContent = "Loading " + percentage + "%";
        }).then(function (unityInstance) {
          window.SokobanUnityInstance = unityInstance;
          loadingBar.style.display = "none";
          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          loadingBar.style.display = "none";
          unityShowBanner(message, "error");
        });
      };
      script.onerror = function () {
        loadingBar.style.display = "none";
        unityShowBanner("Game loader could not be loaded.", "error");
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
